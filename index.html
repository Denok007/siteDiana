    <style>
        /* Шрифт для логотипа */
        @font-face {
            font-family: 'Torq';
            src: url('https://fonts.cdnfonts.com/s/72223/Torq.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==========================================================================
           CSS ПЕРЕМЕННЫЕ (Светлая и Темная темы)
           ========================================================================== */
        :root[data-theme="dark"] {
            --color-primary: #E63946;
            --color-primary-hover: #D62828;
            --color-bg-main: #0B0C10;
            --color-bg-card: #1F2833;
            --color-text-main: #FFFFFF;
            --color-text-muted: #9CA3AF;
            --color-border: rgba(255, 255, 255, 0.1);
        }

        :root[data-theme="light"] {
            --color-primary: #E63946;
            --color-primary-hover: #D62828;
            --color-bg-main: #F9FAFB;
            --color-bg-card: #FFFFFF;
            --color-text-main: #111827;
            --color-text-muted: #4B5563;
            --color-border: rgba(0, 0, 0, 0.1);
        }

        /* Базовые стили и PWA Safe Areas */
        body {
            background-color: var(--color-bg-main);
            color: var(--color-text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }

        /* Scroll Reveal Анимации */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Gallery CSS Scroll-Snap */
        .gallery-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .gallery-container::-webkit-scrollbar {
            display: none;
        }
        .gallery-item {
            flex: 0 0 85%;
            scroll-snap-align: center;
            margin-right: 1rem;
        }
        @media (min-width: 768px) {
            .gallery-item { flex: 0 0 45%; }
        }
        @media (min-width: 1024px) {
            .gallery-item { flex: 0 0 30%; }
        }

        /* FAQ Details/Summary */
        details {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
        }
        summary {
            list-style: none;
            cursor: pointer;
        }
        summary::-webkit-details-marker {
            display: none;
        }
        details[open] summary ~ * {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Modal Overlay */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
        }
    </style>
</head>

            gallery: [

            trainers: [
                { name: "Алекс", role: "Главный Тренер", img: "https://placehold.co/300x400/1F2833/FFFFFF?text=Alex" },
                { name: "Мария", role: "Пилатес & Стретчинг", img: "https://placehold.co/300x400/1F2833/FFFFFF?text=Maria" },

                hours: "Пн - Вс: 06:00 - 23:00"

        };

        document.addEventListener("DOMContentLoaded", () => {
            document.title = siteConfig.gymName;
            document.getElementById("ui-logo").textContent = siteConfig.gymName;
            document.getElementById("ui-footer-logo").textContent = siteConfig.gymName;

            const trainersGrid = document.getElementById("ui-trainers-grid");

            const iconMoon = document.getElementById("theme-icon-moon");

            const currentTheme = localStorage.getItem("theme") || "dark";
            htmlTag.setAttribute("data-theme", currentTheme);
            updateThemeIcons(currentTheme);

            themeToggle.addEventListener("click", () => {
                const newTheme = htmlTag.getAttribute("data-theme") === "dark" ? "light" : "dark";
                htmlTag.setAttribute("data-theme", newTheme);
                localStorage.setItem("theme", newTheme);
                updateThemeIcons(newTheme);
            });

            function updateThemeIcons(theme) {
                if (theme === "dark") {
                    iconSun.classList.remove("hidden");
                    iconMoon.classList.add("hidden");
                } else {
                    iconMoon.classList.remove("hidden");
                    iconSun.classList.add("hidden");
                }
            }

            const revealElements = document.querySelectorAll(".reveal");
            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("active");
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

            revealElements.forEach(el => revealObserver.observe(el));
        });

        window.openModal = function() {
            modal.classList.remove("hidden");

            modal.classList.add("hidden");

        document.getElementById("booking-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            
            submitBtn.textContent = "Отправка...";
            submitBtn.disabled = true;

            const name = document.getElementById('booking-name').value;
            const phone = document.getElementById('booking-phone').value;

            if (db) {
                try {
                    const bookingData = { name, phone, createdAt: new Date().toISOString() };
                    await addDoc(collection(db, 'artifacts', appId, 'bookings'), bookingData);
                    syncToGoogleSheets("newLead", bookingData);
                } catch (error) {
                    console.error("Error saving lead to DB:", error);
                }
            }
            
            submitBtn.textContent = "✓ Заявка отправлена!";
            submitBtn.classList.remove("bg-primary", "hover:bg-primaryHover");
            submitBtn.classList.add("bg-green-600", "hover:bg-green-700");
            
            setTimeout(() => {
                closeModal();
                e.target.reset();
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                submitBtn.classList.remove("bg-green-600", "hover:bg-green-700");
                submitBtn.classList.add("bg-primary", "hover:bg-primaryHover");
            }, 2000);
        });

    </script>
</body>
</html>
